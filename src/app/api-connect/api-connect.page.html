<ion-header>
  <ion-toolbar>
    <ion-title>API Connect</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-spinner *ngIf="cargando" class="ion-padding"></ion-spinner>

  <ion-text color="danger" *ngIf="error">
    Error al cargar los datos...
  </ion-text>

  <ion-list *ngIf="!cargando && !error">
    <ion-item *ngFor="let post of posts">
      <ion-label>
        <h2>{{ post.title }}</h2>
        <p>{{ post.body }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
