<ion-header>
  <ion-toolbar>
    <ion-title>Cámara</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <img *ngIf="imagen" [src]="imagen" style="width: 100%; margin-top: 20px; border-radius: 10px;">

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="primary" style="width: 100%; display: flex; justify-content: space-around;">
      <ion-button expand="block" (click)="tomarFoto()">
        Tomar Foto
      </ion-button>
      <ion-button expand="block" (click)="volverHome()">
        Volver al Home
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
